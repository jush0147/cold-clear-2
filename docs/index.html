<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cold Clear 2 WASM</title>
  </head>
  <body>
    <h1>Cold Clear 2 WASM</h1>
    <p>Open the browser console to see the bot's output.</p>
    <div>
      <label for="config">Bot Config (JSON):</label><br />
      <textarea id="config" rows="10" cols="80"></textarea>
    </div>
    <br />
    <button id="start">Start Bot</button>
    <br />
    <h2>Send Message</h2>
    <textarea id="message" rows="5" cols="80"></textarea><br />
    <button id="send">Send</button>

    <script src="./index.js"></script>
  </body>
</html>
