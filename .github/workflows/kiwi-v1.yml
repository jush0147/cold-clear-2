name: Kiwi v1 browser artifact

on:
  push:
    branches: [kiwi-v1]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: kiwi-v1-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jush0147/tetrp
          ref: 0b48cb7e1a50e5f0bba6fcfee05ba8e291bebee2
          path: tetrp-reference
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kiwi-snapshot-v3
      - name: Generate pinned Tetrp differential fixtures
        run: |
          set -euo pipefail
          node scripts/rule-audit/export-fixtures.mjs tetrp-reference kiwi-rule-fixtures.json | tee kiwi-rule-fixture-counts.json
          cp scripts/rule-audit/kiwi_rule_fixtures.rs tests/kiwi_rule_fixtures.rs
      - name: Native regressions including snapshot v3 and rule fixtures
        run: cargo test --release --lib --bins --tests 2>&1 | tee kiwi-native-tests.log
      - name: Dedicated rule differential audit log
        run: cargo test --release --test kiwi_rule_fixtures -- --nocapture 2>&1 | tee kiwi-rule-audit.log
      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown --lib
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Build web and Node packages from the same source
        run: |
          wasm-pack build --release --target web --out-dir pkg
          wasm-pack build --release --target nodejs --out-dir pkg-node
      - name: Placement transport and NEW snapshot protocol acceptance
        run: |
          node scripts/test-tetrp-placement-scheduler.mjs tetrp-reference
          node scripts/test-kiwi-snapshot.mjs tetrp-reference | tee kiwi-snapshot-acceptance.json
          node scripts/wasm-smoke.mjs > kiwi-wasm-smoke.json
      - name: Assemble browser package and handoff
        run: |
          mkdir -p kiwi-v1-browser/pkg
          cp -r pkg/. kiwi-v1-browser/pkg/
          rm -f kiwi-v1-browser/pkg/.gitignore
          cp scripts/lib/kiwi-snapshot-adapter.mjs scripts/lib/tetrp-authority-adapter.mjs scripts/lib/tetrp-placement-path.mjs kiwi-v1-browser/
          cp scripts/kiwi-snapshot-worker.mjs scripts/verify-kiwi-artifact.mjs kiwi-v1-browser/
          cp KIWI_V1_HANDOFF.md CODEX_TETRP_KIWI_TASK.md TETRP_RULE_PARITY_GAPS.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md kiwi-v1-browser/
          cp kiwi-snapshot-acceptance.json kiwi-wasm-smoke.json kiwi-native-tests.log kiwi-rule-fixture-counts.json kiwi-rule-audit.log kiwi-v1-browser/
      - name: Install pinned Tetrp browser-test dependencies
        run: |
          cd tetrp-reference
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: NEW real Chromium and WebKit Worker acceptance
        run: node scripts/test-kiwi-snapshot-browser.mjs | tee kiwi-snapshot-browser.json
      - name: Finalize exact provenance and file hashes
        env:
          KIWI_SOURCE_SHA: ${{ github.sha }}
          KIWI_RUN_ID: ${{ github.run_id }}
          KIWI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          cp kiwi-snapshot-browser.json kiwi-v1-browser/
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const wasm=require('./pkg-node/cold_clear_2.js');
          for(const file of ['kiwi-snapshot-acceptance.json','kiwi-snapshot-browser.json']) {
            if(JSON.parse(fs.readFileSync(file,'utf8')).status!=='passed')throw new Error('Snapshot gate failed: '+file);
          }
          const manifest={
            schema:'tetrp-kiwi-build/3',name:'Kiwi',product_version:'kiwi-v1-snapshot-v3',
            source_repository:'jush0147/cold-clear-2',source_branch:'kiwi-v1',
            source_commit:process.env.KIWI_SOURCE_SHA,build_commit:process.env.KIWI_SOURCE_SHA,
            workflow_run_id:Number(process.env.KIWI_RUN_ID),workflow_run_attempt:Number(process.env.KIWI_RUN_ATTEMPT),
            artifact_name:'kiwi-v1-browser',
            baseline_artifact_id:10600729877,baseline_build_run_id:35500047026,
            baseline_source_commit:'15135ae8066c95308a3ae87ce149f5cdc7e13043',
            rule_repair_lineage_commit:'2b6c197e8bcb1cd9e86c8888e5dd7b66cc41c9d0',
            tetrp_test_ref:'0b48cb7e1a50e5f0bba6fcfee05ba8e291bebee2',
            product_handoff_blob:'eb7ece11f289b670d2953368dfa2166846ec4a8a',
            strategy_profile:'review_h9_h12',strategy_promotion:false,
            default_node_budget:200000,visible_next:5,
            snapshot_api:'analyze_snapshot_json',request_schema:'kiwi-snapshot/3',result_schema:'kiwi-snapshot-result/3',
            worker:'kiwi-snapshot-worker.mjs',
            artifact_hash_contract:'exact file set plus SHA256; post-upload verification required',
            capabilities:JSON.parse(wasm.snapshot_capabilities_json()),
            phase_4b_implemented:false,downstream_tetrp_pin_changed:false
          };
          fs.writeFileSync('kiwi-v1-browser/kiwi-build.json',JSON.stringify(manifest,null,2)+'\n');
          function walk(dir){return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(dir,e.name)):[path.join(dir,e.name)]);}
          const hashes={};
          for(const file of walk('kiwi-v1-browser').sort())hashes[path.relative('kiwi-v1-browser',file)]=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          fs.writeFileSync('kiwi-v1-browser/sha256.json',JSON.stringify(hashes,null,2)+'\n');
          console.log(JSON.stringify(manifest,null,2));
          NODE
          node scripts/verify-kiwi-artifact.mjs kiwi-v1-browser
      - name: Upload accepted Kiwi browser artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-v1-browser
          path: kiwi-v1-browser/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-snapshot-failure-diagnostics
          path: |
            kiwi-native-tests.log
            kiwi-snapshot-acceptance.json
            kiwi-snapshot-browser.json
            kiwi-rule-fixture-counts.json
            kiwi-rule-audit.log
          if-no-files-found: ignore
          retention-days: 7
  verify-archive:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: kiwi-v1-browser
          path: downloaded-artifact
      - name: Verify actual downloaded file set and every hash
        run: node scripts/verify-kiwi-artifact.mjs downloaded-artifact
  notify:
    needs: verify-archive
    if: ${{ needs.verify-archive.result == 'success' }}
    uses: ./.github/workflows/ntfy-test.yml
    with:
      title: Kiwi snapshot artifact ready
      message: Snapshot-v3 same-piece Hold/root-geometry artifact passed rule, browser, and post-upload hash verification. Review before Tetrp Phase 4A integration.
    secrets:
      NTFY_URL: ${{ secrets.NTFY_URL }}
