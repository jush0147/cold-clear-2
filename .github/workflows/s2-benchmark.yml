name: s2-benchmark

on:
  push:
    branches: [tetrio-s2]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run rules tests
        run: cargo test --lib

      - name: Compare legacy and S2 evaluators
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --bin tl_s2_bench -- --seeds 4 --pieces 80 --nodes 500 | tee s2-benchmark.txt

      - name: Sweep legacy shaping in paired garbage duels
        shell: bash
        run: |
          set -euo pipefail
          : > s2-sweep.txt
          for shape in 0.00 0.25 0.50 0.75 1.00; do
            echo "===== shape=$shape =====" | tee -a s2-sweep.txt
            cargo run --release --bin tl_s2_duel -- --seeds 20 --pieces 120 --nodes 300 --charge 0.50 --shape "$shape" | tee -a s2-sweep.txt
          done

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: s2-benchmark
          path: |
            s2-benchmark.txt
            s2-sweep.txt
