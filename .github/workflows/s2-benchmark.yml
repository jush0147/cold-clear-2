name: s2-correctness

on:
  push:
    branches: [tetrio-s2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2-correctness-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Native regression tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --lib --bins --tests 2>&1 | tee native-tests.txt
      - name: Release-mode board and observation regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --test core_regressions 2>&1 | tee release-tests.txt
      - name: Check all native targets
        run: cargo check --all-targets
      - name: Check WASM library
        run: cargo check --lib --target wasm32-unknown-unknown
      - name: Inspect public upstream evidence (not a parity test)
        if: always()
        run: python3 scripts/inspect-rule-evidence.py
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-correctness-${{ github.sha }}
          path: |
            native-tests.txt
            release-tests.txt
            rule-evidence.json
          retention-days: 14
      - name: Record audit scope
        if: always()
        shell: bash
        run: |
          echo 'Strength sweeps are paused. Regression success is NOT certification of TETR.IO parity.' >> "$GITHUB_STEP_SUMMARY"
          echo "Audited revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '## Native tests' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^running |^test result:' native-tests.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '## Release tests' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^running |^test result:' release-tests.txt >> "$GITHUB_STEP_SUMMARY" || true
