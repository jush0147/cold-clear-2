name: s2-correctness

on:
  push:
    branches: [tetrio-s2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2-correctness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Native regression tests
        run: cargo test --lib --bins --tests
      - name: Check all native targets
        run: cargo check --all-targets
      - name: Check WASM library
        run: cargo check --lib --target wasm32-unknown-unknown
      - name: Inspect public upstream rule evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import re, hashlib, urllib.request, urllib.parse
          base = 'https://tetr.io/'
          try:
              req = urllib.request.Request(base, headers={'User-Agent': 'Mozilla/5.0'})
              html = urllib.request.urlopen(req, timeout=20).read().decode('utf-8')
              scripts = re.findall(r'<script[^>]+src=[\"\x27]([^\"\x27]+)', html)
              print('Public script URLs:', scripts)
              candidates = [urllib.parse.urljoin(base, s) for s in scripts if 'tetrio' in s.lower()]
              for url in candidates[:2]:
                  raw = urllib.request.urlopen(url, timeout=30).read().decode('utf-8')
                  print('PUBLIC CLIENT', url, 'bytes', len(raw), 'sha256', hashlib.sha256(raw.encode()).hexdigest())
                  for key in ['allclear_garbage', 'allclear', 'b2bcharging', 'garbagespecial', 'all-mini', 'openerphase']:
                      hits = list(re.finditer(re.escape(key), raw, flags=re.I))
                      print('KEY', key, 'matches', len(hits))
                      for m in hits[:4]:
                          print(raw[max(0,m.start()-180):m.end()+360])
          except Exception as exc:
              print('Public client evidence unavailable:', type(exc).__name__, str(exc))
          PY
      - name: Record audit scope
        if: always()
        run: |
          echo 'Strength sweeps are paused. Passing regression tests is not certification of TETR.IO parity.' >> "$GITHUB_STEP_SUMMARY"
          echo "Audited revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
