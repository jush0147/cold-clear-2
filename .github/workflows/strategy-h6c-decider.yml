name: H6C direct finalist decider
on:
  push:
    branches: [s2-strategy-clean]
    paths: ['.github/workflows/strategy-h6c-decider.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  decider:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - { id: b00, start: 27000 }
          - { id: b01, start: 27020 }
          - { id: b02, start: 27040 }
          - { id: b03, start: 27060 }
          - { id: b04, start: 27080 }
          - { id: b05, start: 27100 }
          - { id: b06, start: 27120 }
          - { id: b07, start: 27140 }
          - { id: b08, start: 27160 }
          - { id: b09, start: 27180 }
    steps:
      - name: Download frozen H6C engine from screening run
        uses: actions/download-artifact@v4
        with:
          name: h6c-engine
          path: engine
          github-token: ${{ github.token }}
          run-id: 35214925328
      - name: Verify frozen source and executable
        run: |
          test "$(cat engine/commit.txt)" = 'd9131dbb125af812f7943da644715d5893cb1a66'
          echo 'af3adbcc54bb6524688a723fdab988bdc4bca0c64501bb96ed3944f9893b120e  engine/strategy_h6c' | sha256sum -c -
          chmod +x engine/strategy_h6c
      - name: Run 20 fresh shared seeds, both sides, KO only
        env:
          START: ${{ matrix.start }}
        run: |
          mkdir -p results
          # Direct finalist comparison: validation winner 2.5x versus upper-plateau finalist 4.0x.
          # If this decider is inconclusive, the predeclared validation winner 2.5x proceeds to fixed confirmation vs H2.
          engine/strategy_h6c --row-transition-scale 2.5 --incumbent-row-transition-scale 4.0 --start "$START" --seeds 20 --nodes 10000 | tee results/ko.jsonl
          cp engine/commit.txt engine/sha256.txt results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h6c-decider-${{ matrix.id }}
          path: results/
          if-no-files-found: error
