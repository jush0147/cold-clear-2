name: wasm

on:
  push:
    branches: [main, wasm-port, tetrio-s2, s2-strategy-clean]
  pull_request:
    branches: [main, wasm-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Native regression tests
        run: cargo test --lib --bins --tests
      - name: Check wasm target
        run: cargo check --target wasm32-unknown-unknown --lib
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build browser wasm package
        run: wasm-pack build --release --target web --out-dir pkg
      - name: Build Node wasm package for smoke test
        run: wasm-pack build --release --target nodejs --out-dir pkg-node
      - name: Run wasm regression smoke test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/wasm-smoke.mjs | tee wasm-runtime.json
      - name: Benchmark hard node budgets in Node WASM
        shell: bash
        run: |
          set -euo pipefail
          node scripts/wasm-bench.mjs | tee wasm-benchmark.json
      - name: Package browser benchmark bundle
        shell: bash
        run: |
          rm -rf browser-bench
          mkdir -p browser-bench
          cp -r pkg browser-bench/pkg
          cp benches/wasm-review.html browser-bench/index.html
      - name: Upload browser wasm package
        uses: actions/upload-artifact@v4
        with:
          name: cold-clear-2-wasm
          path: pkg/
      - name: Upload browser benchmark bundle
        uses: actions/upload-artifact@v4
        with:
          name: cold-clear-2-browser-bench
          path: browser-bench/
      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: wasm-runtime-${{ github.sha }}
          path: |
            wasm-runtime.json
            wasm-benchmark.json
