name: 200k lineage H9 vs H6C

on:
  push:
    branches: [s2-strategy-clean]
    paths:
      - '.github/workflows/strategy-lineage-200k-h9.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate current-core H9 lineage harness
        run: python3 scripts/wire-lineage-h9-200k.py

      - name: Verify current corrected core and harness
        run: |
          cargo test --release --lib
          cargo test --release --bin strategy_lineage_h9

      - name: Build frozen lineage engine
        run: |
          cargo build --release --bin strategy_lineage_h9
          mkdir -p engine
          cp target/release/strategy_lineage_h9 engine/
          cp src/bin/strategy_lineage_h9.rs engine/
          git rev-parse HEAD > engine/commit.txt
          sha256sum engine/strategy_lineage_h9 engine/strategy_lineage_h9.rs > engine/manifest.sha256

      - name: Run 200k A/A control
        run: |
          mkdir -p control
          engine/strategy_lineage_h9 \
            --cavity-excavation 0 \
            --incumbent-cavity-excavation 0 \
            --nodes 200000 \
            --start 47590 \
            --seeds 2 | tee control/aa.jsonl

      - name: Upload frozen lineage engine and A/A
        uses: actions/upload-artifact@v4
        with:
          name: lineage-h9-engine
          path: |
            engine/
            control/
          if-no-files-found: error

  batch:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { id: b00, start: 47600 }
          - { id: b01, start: 47605 }
          - { id: b02, start: 47610 }
          - { id: b03, start: 47615 }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lineage-h9-engine
          path: frozen

      - name: Verify frozen engine
        run: |
          (cd frozen/engine && sha256sum -c manifest.sha256)
          chmod +x frozen/engine/strategy_lineage_h9

      - name: Run five fresh paired seeds at 200k
        env:
          ID: ${{ matrix.id }}
          START: ${{ matrix.start }}
        run: |
          mkdir -p results
          frozen/engine/strategy_lineage_h9 \
            --cavity-excavation -0.5 \
            --incumbent-cavity-excavation 0 \
            --nodes 200000 \
            --start "$START" \
            --seeds 5 | tee "results/${ID}.jsonl"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lineage-h9-${{ matrix.id }}
          path: results/
          if-no-files-found: error

  summarize:
    needs: [build, batch]
    if: always() && needs.build.result == 'success' && needs.batch.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lineage-h9-b*
          path: combined
          merge-multiple: true

      - name: Summarize paired H9 vs H6C evidence
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path

          games=[]
          for path in sorted(Path('combined').glob('*.jsonl')):
              for line in path.read_text().splitlines():
                  obj=json.loads(line)
                  if obj.get('type')=='game':
                      games.append(obj)

          pairs={}
          for g in games:
              pairs.setdefault(g['seed'], []).append(g)

          cs=isw=split=malformed=0
          depths=[]
          for seed, gs in sorted(pairs.items()):
              if len(gs)!=2:
                  malformed+=1
                  continue
              wins=sum(g['winner']=='candidate' for g in gs)
              if wins==2:
                  cs+=1
              elif wins==0:
                  isw+=1
              else:
                  split+=1
              for g in gs:
                  depths.extend(g.get('max_search_depth', []))

          n=cs+isw
          k=min(cs,isw)
          tail=sum(math.comb(n,i) for i in range(k+1))/(2**n) if n else 0.5
          p=min(1.0,2*tail) if n else 1.0

          summary={
              'experiment':'200k lineage H9 vs H6C',
              'candidate':'H9 cavity=-0.5 + H6C + H12',
              'incumbent':'H6C cavity=0 + H12',
              'nodes_per_move':200000,
              'seed_start':47600,
              'paired_seeds':len(pairs),
              'games':len(games),
              'candidate_wins':sum(g['winner']=='candidate' for g in games),
              'incumbent_wins':sum(g['winner']=='incumbent' for g in games),
              'candidate_sweeps':cs,
              'incumbent_sweeps':isw,
              'split_pairs':split,
              'paired_exact_sign_p':p,
              'malformed_pairs':malformed,
              'all_reason_no_legal_placement':all(g.get('reason')=='no_legal_placement' for g in games),
              'max_search_depth_range':[min(depths),max(depths)] if depths else None,
          }
          Path('summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: lineage-h9-summary
          path: summary.json
          if-no-files-found: error
