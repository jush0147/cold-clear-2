name: Strategy KO experiment
on:
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: strategy-ko-native
      - name: Fix legacy serde_json duration serialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/bin/strategy_ko.rs')
          s = p.read_text()
          s = s.replace('started.elapsed().as_millis()', 'started.elapsed().as_millis().min(u64::MAX as u128) as u64') if 'as_millis().min(' not in s else s
          p.write_text(s)
          PY
      - name: Regression tests
        run: cargo test --release --lib --bins --tests 2>&1 | tee regression.log
      - name: Commit tested fix
        if: github.ref == 'refs/heads/s2-strategy-clean'
        run: |
          if ! git diff --quiet -- src/bin/strategy_ko.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/bin/strategy_ko.rs
            git commit -m 'Serialize completed KO reports as supported u64 durations'
            git push origin HEAD:s2-strategy-clean
          fi
      - name: Build native executable
        run: cargo build --release --bin strategy_ko
      - name: Package exact tested source and executable
        run: |
          mkdir -p ko-artifact
          cp target/release/strategy_ko regression.log ko-artifact/
          git rev-parse HEAD > ko-artifact/commit.txt
          git archive --format=tar.gz -o ko-artifact/source.tar.gz HEAD
          sha256sum ko-artifact/strategy_ko > ko-artifact/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-ko-native
          path: ko-artifact/
      - name: A/A KO control
        run: target/release/strategy_ko --candidate 0 --seeds 2 --start 0 --nodes 10000 | tee control.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-ko-control
          path: |
            control.jsonl
            regression.log
