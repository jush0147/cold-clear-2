name: review-regressions
on:
  push:
    branches: [tetrio-s2]
    paths: ['src/**', 'tests/**', 'scripts/**', 'Cargo.*', '.github/workflows/review-foundation.yml']
  pull_request:
    branches: [tetrio-s2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Native, release and receipt regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib --bins --tests 2>&1 | tee native-review.txt
          cargo test --locked --release --lib --test replay_fixtures
          cargo check --locked --all-targets
          node scripts/test-receive-ledger.cjs | tee receive-tests.json
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build and execute WASM regressions
        shell: bash
        run: |
          set -euo pipefail
          wasm-pack build --release --target nodejs --out-dir pkg-node -- --locked
          node scripts/wasm-smoke.mjs
          node scripts/recorded-wasm-smoke.cjs
          node scripts/review-smoke.cjs | tee review-repeatability.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-regressions-${{ github.sha }}
          path: |
            native-review.txt
            receive-tests.json
            review-repeatability.json
          retention-days: 14
