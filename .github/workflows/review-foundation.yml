name: review-foundation
on:
  push:
    branches: [tetrio-s2]
    paths: ['.github/workflows/review-foundation.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: review-foundation
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/tetrio-s2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tetrio-s2
      - name: Apply bounded and readable source migration
        run: python3 scripts/review-foundation.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Native, release, and receipt accounting regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib --bins --tests 2>&1 | tee review-native.txt
          cargo test --locked --release --lib --test replay_fixtures 2>&1 | tee review-release.txt
          cargo check --locked --all-targets
          node scripts/test-receive-ledger.cjs | tee receive-tests.json
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build browser and Node WASM
        run: |
          wasm-pack build --release --target web --out-dir pkg -- --locked
          wasm-pack build --release --target nodejs --out-dir pkg-node -- --locked
      - name: Execute recorded and deterministic WASM review checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/wasm-smoke.mjs | tee review-smoke.json
          node scripts/recorded-wasm-smoke.cjs | tee recorded-smoke.json
          node scripts/review-smoke.cjs | tee review-repeatability.json
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests/replay_fixtures.rs scripts/reconstruct-replay.cjs scripts/recorded-wasm-smoke.cjs
          git commit -m 'Make review clock-free and reproducible; audit received garbage at confirmation'
          git push origin HEAD:tetrio-s2
          git rev-parse HEAD > verified-commit.txt
      - name: Archive tested source and outcomes
        if: always()
        run: |
          mkdir -p review-result
          cp review-*.txt review-*.json receive-tests.json recorded-smoke.json verified-commit.txt review-result/ 2>/dev/null || true
          tar -cf review-result/tested-source.tar src tests scripts Cargo.toml Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clock-free-review-result
          path: |
            review-result/
            pkg/
            pkg-node/
          retention-days: 14
