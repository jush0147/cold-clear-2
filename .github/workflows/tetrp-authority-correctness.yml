name: Tetrp authority correctness

on:
  push:
    branches: [tetrp-authority]
    paths:
      - 'src/data.rs'
      - 'src/tetrio.rs'
      - 'src/analysis.rs'
      - 'src/forecast.rs'
      - 'src/ko_support.rs'
      - 'src/lib.rs'
      - 'src/bot.rs'
      - 'src/bot/freestyle.rs'
      - 'src/wasm.rs'
      - 'scripts/lib/tetrp-authority-adapter.mjs'
      - 'scripts/lib/tetrp-placement-path.mjs'
      - 'scripts/test-tetrp-placement-scheduler.mjs'
      - 'scripts/test-tetrp-authority-adapter.mjs'
      - '.github/workflows/tetrp-authority-correctness.yml'
  workflow_dispatch:

concurrency:
  group: tetrp-gate-tetrp-authority-correctness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: jush0147/tetrp
          ref: 0b48cb7e1a50e5f0bba6fcfee05ba8e291bebee2
          path: tetrp-reference
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: Run full Cold Clear regressions
        run: cargo test --release

      - name: Test visible-state adapter
        run: node scripts/test-tetrp-authority-adapter.mjs
      - name: Test placement transport scheduler
        run: node scripts/test-tetrp-placement-scheduler.mjs tetrp-reference

      - name: Verify pinned Tetrp attack authority
        run: node --test tetrp-reference/test/attack.test.js
