name: H10 fixed-finalist exploitation confirmation
on:
  push:
    branches: [s2-strategy-clean]
    paths: ['.github/workflows/strategy-h10-confirm.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  confirm:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - { id: b00, start: 42000 }
          - { id: b01, start: 42020 }
          - { id: b02, start: 42040 }
          - { id: b03, start: 42060 }
          - { id: b04, start: 42080 }
          - { id: b05, start: 42100 }
          - { id: b06, start: 42120 }
          - { id: b07, start: 42140 }
          - { id: b08, start: 42160 }
          - { id: b09, start: 42180 }
    steps:
      - name: Download frozen H10 engine from screening run
        uses: actions/download-artifact@v4
        with:
          name: h10-engine
          path: engine
          github-token: ${{ github.token }}
          run-id: 35284463845
      - name: Verify frozen H10 source and executable
        run: |
          test "$(cat engine/commit.txt)" = '327b45964fb60a30a40f9137c0d0e07e4667a0a6'
          echo 'ff871957179fab3c1a025d0dd443ecd9d0c05f62ab07d040bc2c70183ce69544  engine/freestyle.rs' | sha256sum -c -
          echo '2f9a0dfe40b1553b4c71e36d42cb856ed5dd2c232601bcdbde98e432e6821865  engine/strategy_h10.rs' | sha256sum -c -
          echo '4dd9bae9a6c4d85f520fa1d5f586c792cea46a9f1185ecc66a1b6c12d30d8624  engine/strategy_h10' | sha256sum -c -
          chmod +x engine/strategy_h10
      - name: Run 20 fresh paired seeds, KO only
        run: |
          mkdir -p results
          printf '%s\n' 'validation 46-34; sweeps 12-6; split 22; paired p=0.237884521484375' > results/finalist-record.txt
          printf '%s\n' 'candidate approx rank-0 share 0.55; exploitation 0.7985076962177716' > results/candidate.txt
          printf '%s\n' 'incumbent approx rank-0 share 0.50; exploitation ln(2)=0.6931471805599453' > results/incumbent.txt
          cp engine/commit.txt engine/core.sha256 engine/harness.sha256 engine/executable.sha256 results/
          engine/strategy_h10 \
            --exploitation 0.7985076962177716 \
            --incumbent-exploitation 0.6931471805599453 \
            --start ${{ matrix.start }} --seeds 20 --nodes 10000 | tee results/ko.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h10-confirm-${{ matrix.id }}
          path: results/
          if-no-files-found: error
