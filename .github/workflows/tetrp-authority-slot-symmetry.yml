name: Tetrp authority slot symmetry

on:
  push:
    branches: [s2-strategy-clean]
    paths:
      - 'src/analysis.rs'
      - 'src/forecast.rs'
      - 'scripts/lib/tetrp-authority-adapter.mjs'
      - 'scripts/lib/tetrp-placement-path.mjs'
      - 'scripts/generate-tetrp-exhibition.mjs'
      - 'scripts/compare-tetrp-slot-swap.mjs'
      - '.github/workflows/tetrp-authority-slot-symmetry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symmetry:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: jush0147/tetrp
          ref: 0b48cb7e1a50e5f0bba6fcfee05ba8e291bebee2
          path: tetrp-reference
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build Node WASM
        run: wasm-pack build --release --target nodejs --out-dir pkg-node

      - name: Run tuned slot0 vs legacy slot1
        env:
          EXHIBITION_SEED: '60010'
          NODE_BUDGET: '10000'
          FRAMES_PER_PIECE: '30'
          SLOT0_PROFILE: review_h9_h12
          SLOT1_PROFILE: corrected_legacy_h12
          SLOT0_NAME: TUNED
          SLOT1_NAME: LEGACY
          STOP_AFTER_PIECES: '80'
        run: |
          set -o pipefail
          mkdir -p symmetry
          node scripts/generate-tetrp-exhibition.mjs tetrp-reference symmetry/ab.ttrm | tee symmetry/ab.log

      - name: Run legacy slot0 vs tuned slot1
        env:
          EXHIBITION_SEED: '60010'
          NODE_BUDGET: '10000'
          FRAMES_PER_PIECE: '30'
          SLOT0_PROFILE: corrected_legacy_h12
          SLOT1_PROFILE: review_h9_h12
          SLOT0_NAME: LEGACY
          SLOT1_NAME: TUNED
          STOP_AFTER_PIECES: '80'
        run: |
          set -o pipefail
          node scripts/generate-tetrp-exhibition.mjs tetrp-reference symmetry/ba.ttrm | tee symmetry/ba.log

      - name: Compare slot-swapped traces
        run: |
          node scripts/compare-tetrp-slot-swap.mjs             symmetry/ab.ttrm.diagnostic.json             symmetry/ba.ttrm.diagnostic.json

      - name: Validate both replays through pinned Tetrp
        run: |
          node tetrp-reference/scripts/validate-replays.mjs symmetry/ab.ttrm --output symmetry/ab-validation.json
          node tetrp-reference/scripts/validate-replays.mjs symmetry/ba.ttrm --output symmetry/ba-validation.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tetrp-authority-slot-symmetry
          path: symmetry/
          if-no-files-found: error
          retention-days: 14
