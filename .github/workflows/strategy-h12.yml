name: H12 best-child demotion backprop
on:
  push:
    branches: [s2-strategy-clean]
    paths:
      - 'scripts/wire-h12.py'
      - '.github/workflows/strategy-h12.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: strategy-h12-native

      - name: Generate isolated H12 core and harness
        run: python3 scripts/wire-h12.py

      - name: Reproduce and fix demoted-best regression
        run: |
          cargo test --release --lib dag::h12_tests::h12_demoted_best_requires_parent_recompute -- --exact --nocapture
          cargo test --release --lib dag::h12_tests::h12_nonbest_change_that_stays_nonbest_needs_no_parent_recompute -- --exact --nocapture

      - name: Check H12 harness and full library regressions
        run: |
          cargo test --release --bin strategy_h12 2>&1 | tee h12-regression.log
          cargo test --release --lib

      - name: Build frozen executable
        run: cargo build --release --bin strategy_h12

      - name: Package exact tested sources and binary
        run: |
          mkdir -p h12-engine
          cp src/bot.rs h12-engine/
          cp src/bot/freestyle.rs h12-engine/
          cp src/dag.rs h12-engine/
          cp src/dag/known.rs h12-engine/
          cp src/dag/speculated.rs h12-engine/
          cp src/bin/strategy_h12.rs h12-engine/
          cp target/release/strategy_h12 h12-engine/
          cp h12-regression.log h12-engine/
          git rev-parse HEAD | tee h12-engine/commit.txt
          sha256sum src/bot.rs | awk '{print $1 "  bot.rs"}' | tee h12-engine/bot.sha256
          sha256sum src/bot/freestyle.rs | awk '{print $1 "  freestyle.rs"}' | tee h12-engine/core.sha256
          sha256sum src/dag.rs | awk '{print $1 "  dag.rs"}' | tee h12-engine/dag.sha256
          sha256sum src/dag/known.rs | awk '{print $1 "  known.rs"}' | tee h12-engine/known.sha256
          sha256sum src/dag/speculated.rs | awk '{print $1 "  speculated.rs"}' | tee h12-engine/speculated.sha256
          sha256sum src/bin/strategy_h12.rs | awk '{print $1 "  strategy_h12.rs"}' | tee h12-engine/harness.sha256
          sha256sum target/release/strategy_h12 | awk '{print $1 "  strategy_h12"}' | tee h12-engine/executable.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: h12-engine
          path: h12-engine/
          if-no-files-found: error

      - name: H9/H9 legacy A/A control through H12 engine
        run: |
          target/release/strategy_h12 \
            --backprop-best-demotion false \
            --incumbent-backprop-best-demotion false \
            --start 43990 --seeds 2 --nodes 10000 | tee h12-control.jsonl

      - uses: actions/upload-artifact@v4
        with:
          name: h12-control
          path: h12-control.jsonl
          if-no-files-found: error

  screen:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: h12-engine
          path: engine

      - name: Verify frozen H12 engine
        run: |
          (cd engine && sha256sum -c bot.sha256 && sha256sum -c core.sha256 && sha256sum -c dag.sha256 && sha256sum -c known.sha256 && sha256sum -c speculated.sha256 && sha256sum -c harness.sha256 && sha256sum -c executable.sha256)
          chmod +x engine/strategy_h12

      - name: Run 40 fresh paired seeds, both sides, KO only
        run: |
          mkdir -p results
          engine/strategy_h12 \
            --backprop-best-demotion true \
            --incumbent-backprop-best-demotion false \
            --start 44000 --seeds 40 --nodes 10000 | tee results/ko.jsonl
          cp engine/commit.txt engine/bot.sha256 engine/core.sha256 engine/dag.sha256 engine/known.sha256 engine/speculated.sha256 engine/harness.sha256 engine/executable.sha256 results/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h12-screen
          path: results/
          if-no-files-found: error
