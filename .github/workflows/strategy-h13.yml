name: H13 revealed-piece despeculation backprop
on:
  push:
    branches: [s2-strategy-clean]
    paths:
      - 'scripts/wire-h13.py'
      - '.github/workflows/strategy-h13.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: strategy-h13-native

      - name: Generate isolated H13 core and harness
        run: python3 scripts/wire-h13.py

      - name: Verify revealed-piece regression
        run: |
          cargo test --release --lib dag::h13_tests::h13_revealed_piece_replaces_speculative_average_with_known_best -- --exact --nocapture
          cargo test --release --lib dag::h13_tests::h13_unexpanded_despeculated_node_keeps_existing_eval -- --exact --nocapture

      - name: Check H13 harness and full library regressions
        run: |
          cargo test --release --bin strategy_h13 2>&1 | tee h13-regression.log
          cargo test --release --lib

      - name: Build frozen executable
        run: cargo build --release --bin strategy_h13

      - name: Package exact tested sources and binary
        run: |
          mkdir -p h13-engine
          cp src/bot.rs h13-engine/
          cp src/bot/freestyle.rs h13-engine/
          cp src/dag.rs h13-engine/
          cp src/dag/known.rs h13-engine/
          cp src/dag/speculated.rs h13-engine/
          cp src/map.rs h13-engine/
          cp src/bin/strategy_h13.rs h13-engine/
          cp target/release/strategy_h13 h13-engine/
          cp h13-regression.log h13-engine/
          git rev-parse HEAD | tee h13-engine/commit.txt
          sha256sum src/bot.rs | awk '{print $1 "  bot.rs"}' | tee h13-engine/bot.sha256
          sha256sum src/bot/freestyle.rs | awk '{print $1 "  freestyle.rs"}' | tee h13-engine/core.sha256
          sha256sum src/dag.rs | awk '{print $1 "  dag.rs"}' | tee h13-engine/dag.sha256
          sha256sum src/dag/known.rs | awk '{print $1 "  known.rs"}' | tee h13-engine/known.sha256
          sha256sum src/dag/speculated.rs | awk '{print $1 "  speculated.rs"}' | tee h13-engine/speculated.sha256
          sha256sum src/map.rs | awk '{print $1 "  map.rs"}' | tee h13-engine/map.sha256
          sha256sum src/bin/strategy_h13.rs | awk '{print $1 "  strategy_h13.rs"}' | tee h13-engine/harness.sha256
          sha256sum target/release/strategy_h13 | awk '{print $1 "  strategy_h13"}' | tee h13-engine/executable.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: h13-engine
          path: h13-engine/
          if-no-files-found: error

      - name: Corrected-H12 A/A control with legacy despeculation
        run: |
          target/release/strategy_h13 \
            --backprop-despeculated-values false \
            --incumbent-backprop-despeculated-values false \
            --start 45990 --seeds 2 --nodes 10000 | tee h13-control.jsonl

      - uses: actions/upload-artifact@v4
        with:
          name: h13-control
          path: h13-control.jsonl
          if-no-files-found: error

  screen:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: h13-engine
          path: engine

      - name: Verify frozen H13 engine
        run: |
          (cd engine && sha256sum -c bot.sha256 && sha256sum -c core.sha256 && sha256sum -c dag.sha256 && sha256sum -c known.sha256 && sha256sum -c speculated.sha256 && sha256sum -c map.sha256 && sha256sum -c harness.sha256 && sha256sum -c executable.sha256)
          chmod +x engine/strategy_h13

      - name: Run 40 fresh paired seeds, KO only
        run: |
          mkdir -p results
          engine/strategy_h13 \
            --backprop-despeculated-values true \
            --incumbent-backprop-despeculated-values false \
            --start 46000 --seeds 40 --nodes 10000 | tee results/ko.jsonl
          cp engine/commit.txt engine/bot.sha256 engine/core.sha256 engine/dag.sha256 engine/known.sha256 engine/speculated.sha256 engine/map.sha256 engine/harness.sha256 engine/executable.sha256 results/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h13-screen
          path: results/
          if-no-files-found: error
