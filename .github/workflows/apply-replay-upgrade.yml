name: replay-regressions
on:
  push:
    branches: [tetrio-s2]
    paths: ['src/**', 'tests/**', 'Cargo.*', 'scripts/recorded-wasm-smoke.cjs', '.github/workflows/apply-replay-upgrade.yml']
  pull_request:
    branches: [tetrio-s2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: replay-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recorded:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Debug and release regressions
        run: |
          cargo test --locked --lib --bins --tests
          cargo test --locked --release --test replay_fixtures
          cargo check --locked --all-targets
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build and execute recorded WASM fixtures
        shell: bash
        run: |
          set -euo pipefail
          wasm-pack build --release --target nodejs --out-dir pkg-node -- --locked
          node scripts/wasm-smoke.mjs
          node scripts/recorded-wasm-smoke.cjs | tee recorded-wasm.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-wasm-${{ github.sha }}
          path: recorded-wasm.json
          retention-days: 14
