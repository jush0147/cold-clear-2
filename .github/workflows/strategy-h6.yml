name: H6 base-height safety screening
on:
  push:
    branches: [s2-strategy-clean]
    paths:
      - 'scripts/wire-h6.py'
      - '.github/workflows/strategy-h6.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: strategy-h6-native
      - name: Apply isolated H6 wiring
        run: python3 scripts/wire-h6.py
      - name: Regression tests
        run: cargo test --release --lib --bins --tests 2>&1 | tee regression.log
      - name: Commit tested H6 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/wire-h6.py
          git add src/bin/strategy_h6.rs
          git commit -m 'Add isolated H6 base-height harness'
          git push origin HEAD:s2-strategy-clean
      - name: Build frozen executable
        run: cargo build --release --bin strategy_h6
      - id: meta
        name: Package exact tested source and binary
        run: |
          mkdir -p h6-engine
          cp target/release/strategy_h6 regression.log h6-engine/
          git rev-parse HEAD | tee h6-engine/commit.txt
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          sha256sum target/release/strategy_h6 | awk '{print $1 "  strategy_h6"}' | tee h6-engine/sha256.txt
          git archive --format=tar.gz -o h6-engine/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: h6-engine
          path: h6-engine/
          if-no-files-found: error
      - name: H2/H2 A/A control
        run: target/release/strategy_h6 --height-scale 1 --incumbent-height-scale 1 --start 21000 --seeds 2 --nodes 10000 | tee h6-control.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: h6-control
          path: h6-control.jsonl
          if-no-files-found: error

  screen:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - { id: h000, height: 0.00 }
          - { id: h025, height: 0.25 }
          - { id: h050, height: 0.50 }
          - { id: h075, height: 0.75 }
          - { id: h125, height: 1.25 }
          - { id: h150, height: 1.50 }
          - { id: h200, height: 2.00 }
          - { id: h250, height: 2.50 }
          - { id: h300, height: 3.00 }
          - { id: h400, height: 4.00 }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: h6-engine
          path: engine
      - name: Verify frozen engine
        env:
          EXPECTED: ${{ needs.build.outputs.source_sha }}
        run: |
          test "$(cat engine/commit.txt)" = "$EXPECTED"
          (cd engine && sha256sum -c sha256.txt)
          chmod +x engine/strategy_h6
      - name: Run 20 shared seeds, both sides, KO only
        env:
          HEIGHT: ${{ matrix.height }}
        run: |
          mkdir -p results
          engine/strategy_h6 --height-scale "$HEIGHT" --incumbent-height-scale 1 --start 21100 --seeds 20 --nodes 10000 | tee results/ko.jsonl
          cp engine/commit.txt engine/sha256.txt results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h6-screen-${{ matrix.id }}
          path: results/
          if-no-files-found: error
