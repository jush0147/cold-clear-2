name: review-quality
on:
  push:
    branches: [tetrio-s2, review-quality]
    paths: ['src/**', 'tests/**', 'scripts/**', 'web/**', 'Cargo.*', '.github/workflows/review-quality.yml']
  pull_request:
    branches: [tetrio-s2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Native and optimized regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib --bins --tests 2>&1 | tee quality-native.txt
          cargo test --locked --release --lib --test core_regressions --test replay_fixtures 2>&1 | tee quality-release.txt
          cargo check --locked --all-targets
          node scripts/test-receive-ledger.cjs
          node scripts/review-worker-protocol.cjs
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build browser and Node packages
        run: |
          wasm-pack build --release --target web --out-dir pkg -- --locked
          wasm-pack build --release --target nodejs --out-dir pkg-node -- --locked
      - name: Execute WASM regressions and review comparisons
        shell: bash
        run: |
          set -euo pipefail
          node scripts/wasm-smoke.mjs
          node scripts/recorded-wasm-smoke.cjs
          node scripts/review-smoke.cjs
          node scripts/review-session-smoke.cjs | tee quality-review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-quality-${{ github.sha }}
          path: |
            quality-native.txt
            quality-release.txt
            quality-review.json
            pkg/
            web/
          retention-days: 14
