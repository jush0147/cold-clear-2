name: H5 fresh-seed validation
on:
  push:
    branches: [s2-strategy-clean]
    paths: ['.github/workflows/strategy-h5-validate.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { id: c050, combo: 0.50, screen: '24-16' }
          - { id: c200, combo: 2.00, screen: '27-13' }
          - { id: c400, combo: 4.00, screen: '23-17' }
    steps:
      - name: Download frozen H5 engine from screening run
        uses: actions/download-artifact@v4
        with:
          name: h5-engine
          path: engine
          github-token: ${{ github.token }}
          run-id: 35203592286
      - name: Verify frozen source and executable
        run: |
          test "$(cat engine/commit.txt)" = '3970fbee15a94f19970cc3b4b9c915ccce0e3565'
          echo '2f45c6a132d2c559223716bd39ad71452a96c92e9a100105d06409fe14028365  engine/strategy_h5' | sha256sum -c -
          chmod +x engine/strategy_h5
      - name: Run 40 fresh seeds, both sides, KO only
        env:
          COMBO: ${{ matrix.combo }}
        run: |
          mkdir -p results
          printf '%s\n' '${{ matrix.screen }}' > results/screening-record.txt
          cp engine/commit.txt engine/sha256.txt results/
          engine/strategy_h5 --combo-scale "$COMBO" --incumbent-combo-scale 1 --start 19000 --seeds 40 --nodes 10000 | tee results/ko.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h5-validate-${{ matrix.id }}
          path: results/
          if-no-files-found: error
